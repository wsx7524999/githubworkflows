name: Foundation PKI Automation

on:
  workflow_dispatch:
  push:
    paths:
      - "Makefile"
      - "root/**"
      - "intermediate/**"
      - "server/**"
      - "client/**"
      - ".github/workflows/pki.yml"

jobs:
  build-pki:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OpenSSL and Make
        run: |
          sudo apt-get update
          sudo apt-get install -y openssl make

      - name: Rebuild PKI
        run: |
          make clean || true
          make all

      - name: Upload PKI Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: foundation-pki
          path: |
            root/
            intermediate/
            server/
            client/
            foundation-trust-bundle.pem